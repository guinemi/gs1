<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GUINEMI</title>
  <style>
    :root {
      --bg: #10131b;
      --panel: #1b2130;
      --panel-hover: #252e42;
      --border: #303849;
      --accent: #315fca;
      --accent-channel: #1f8a6b;
      --accent-focus: #6ea8ff;
      --text: #f5f6fa;
      --muted: #aeb5c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 Arial, sans-serif;
    }
    body.mode-channels {
      --active-accent: var(--accent-channel);
      --active-border: #69f0c8;
    }
    body:not(.mode-channels) {
      --active-accent: var(--accent);
      --active-border: #8bb6ff;
    }
    .wrap {
      max-width: 1280px;
      margin: auto;
      padding: 18px 18px 40px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .brand-and-modes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .logo-netflix {
      margin: 0 4px 0 0;
      font-family: "Arial Black", "Impact", Arial, sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      color: #e50914;
      text-shadow:
        1px 1px 0 #7a0309,
        2px 2px 0 #570206,
        3px 3px 0 #380104,
        0 6px 18px rgba(229, 9, 20, 0.45);
      transform: scaleY(1.12);
      user-select: none;
      white-space: nowrap;
    }
    .mode-switch {
      display: flex;
      gap: 12px;
      flex: 1;
      min-width: 280px;
      max-width: 620px;
    }
    .mode-btn {
      flex: 1;
      min-height: 58px;
      padding: 14px 24px;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s;
    }
    .mode-btn:hover, .mode-btn.focused {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      outline: none;
    }
    .mode-btn.active[data-mode="channels"] {
      background: var(--accent-channel);
      border-color: #69f0c8;
      box-shadow: 0 6px 20px rgba(31, 138, 107, .35);
    }
    .mode-btn.active[data-mode="movies"] {
      background: var(--accent);
      border-color: #8bb6ff;
      box-shadow: 0 6px 20px rgba(49, 95, 202, .35);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 7px 13px;
      width: 230px;
      max-width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box.focused,
    .search-box:focus-within {
      border-color: var(--accent-focus);
      box-shadow: 0 0 0 2px rgba(110, 168, 255, .22);
    }
    .search-icon {
      font-size: 14px;
      line-height: 1;
      opacity: .9;
      user-select: none;
    }
    .search {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s;
    }
    .tab:hover, .tab.focused {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-1px);
      outline: none;
    }
    .tab.active {
      background: var(--active-accent);
      border-color: var(--active-border);
      color: #fff;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mode-btn { font-size: 17px; padding: 12px 16px; min-height: 52px; }
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .card:hover, .card.focused, .card:focus {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
      outline: none;
    }
    .poster-box {
      position: relative;
      aspect-ratio: 2 / 3;
      width: 100%;
      background: #141926;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .idx-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(16, 19, 27, .85);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      padding: 11px;
      gap: 10px;
    }
    .name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .watch {
      display: block;
      text-align: center;
      background: var(--active-accent);
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body class="mode-channels">
  <main class="wrap">
    <div class="top-bar">
      <div class="brand-and-modes">
        <div class="logo-netflix" aria-label="GUINEMI">GUINEMI</div>
        <div class="mode-switch" role="tablist" aria-label="Canais e Filmes">
          <button type="button" class="mode-btn active" id="btnChannels" data-mode="channels">Canais</button>
          <button type="button" class="mode-btn" id="btnMovies" data-mode="movies">Filmes</button>
        </div>
      </div>

      <label class="search-box" id="searchBox" for="q" aria-label="Pesquisar">

        <input class="search" id="q" placeholder="Pesquisar..." autocomplete="off">

    <div class="count" id="count"></div>

    <section class="grid" id="list" aria-label="Grade de itens"></section>
  </main>

    const PAGE_SIZE = 20;
    let currentMode = "channels";
    let currentPage = 0;
    let currentItems = [];
    let externalWin = null;

    const btnChannels = document.getElementById("btnChannels");
    const btnMovies = document.getElementById("btnMovies");
    const searchInput = document.getElementById("q");
    const tabsEl = document.getElementById("tabs");
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("list");

    function resolveOpenUrl(url) {
      if (!url) return "";
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
      const idParam = url.match(/drive\.google\.com\/.*[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParam && idParam[1]) {
        return `https://drive.google.com/file/d/${idParam[1]}/preview`;
      }
      return url;
    }

    function openInExternalTab(url) {
      const targetUrl = resolveOpenUrl(url);
      if (!targetUrl) return;

      if (REUSE_EXTERNAL_TAB) {
        if (externalWin && !externalWin.closed) {
          externalWin.location.href = targetUrl;
          externalWin.focus();
        } else {
          externalWin = window.open(targetUrl, "GUINEMI_TAB", "noopener,noreferrer");
          if (!externalWin) {
            externalWin = window.open(targetUrl, "GUINEMI_TAB");
          }
        }
      } else {
        window.open(targetUrl, "_blank", "noopener,noreferrer");
      }
    }

    function makePlaceholderCover(title) {
      const safe = String(title || "GUINEMI").slice(0, 24).replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450"><rect width="300" height="450" fill="#182032"/><rect x="14" y="14" width="272" height="422" rx="14" fill="none" stroke="#33415c" stroke-width="2"/><text x="150" y="215" fill="#f5f6fa" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">${safe}</text><text x="150" y="250" fill="#8bb6ff" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">GUINEMI</text></svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function getSourceList() {
      const base = currentMode === "channels" ? CHANNELS : FANTASIA_MOVIES;
      const term = searchInput.value.trim().toLowerCase();
      if (!term) return base;
      return base.filter(item => item.title.toLowerCase().includes(term));
    }

    function renderTabs(totalItems) {
      tabsEl.innerHTML = "";
      const pages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (currentPage >= pages) currentPage = 0;

      if (pages <= 1) return;

      for (let i = 0; i < pages; i++) {
        const start = i * PAGE_SIZE + 1;
        const end = Math.min((i + 1) * PAGE_SIZE, totalItems);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (i === currentPage ? " active" : "");
        btn.textContent = `${start}-${end}`;
        btn.onclick = () => {
          currentPage = i;
          renderGrid();
        };
        tabsEl.appendChild(btn);
      }
    }

    function renderGrid() {
      currentItems = getSourceList();
      renderTabs(currentItems.length);

      const startIdx = currentPage * PAGE_SIZE;
      const pageItems = currentItems.slice(startIdx, startIdx + PAGE_SIZE);

      const labelMode = currentMode === "channels" ? "canais" : "filmes";
      countEl.textContent = `${currentItems.length} ${labelMode} encontrados`;
      listEl.innerHTML = "";

      pageItems.forEach((item, idxInPage) => {
        const globalIndex = startIdx + idxInPage;
        const card = document.createElement("div");
        card.className = "card";
        card.tabIndex = 0;

        const imgSrc = item.cover && item.cover.trim() ? item.cover : makePlaceholderCover(item.title);
        const fallbackSrc = makePlaceholderCover(item.title);

        card.innerHTML = `
          <div class="poster-box">
            <span class="idx-badge">#${globalIndex + 1}</span>
            <img src="${imgSrc}" alt="${item.title.replace(/"/g, "&quot;")}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="name">${item.title}</div>
            <span class="watch">${currentMode === "channels" ? "Abrir Canal" : "Abrir Filme"}</span>
          </div>
        `;

        const imgEl = card.querySelector("img");
        imgEl.onerror = () => {
          if (imgEl.src !== fallbackSrc) imgEl.src = fallbackSrc;
        };

        card.onclick = () => openInExternalTab(item.url);
        card.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openInExternalTab(item.url);
          }
        };

        listEl.appendChild(card);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      currentPage = 0;
      document.body.classList.toggle("mode-channels", mode === "channels");
      btnChannels.classList.toggle("active", mode === "channels");
      btnMovies.classList.toggle("active", mode === "movies");
      renderGrid();
    }

    btnChannels.onclick = () => setMode("channels");
    btnMovies.onclick = () => setMode("movies");
    searchInput.oninput = () => {
      currentPage = 0;
      renderGrid();
    };

    renderGrid();
  </script>
