<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GUINEMI</title>
  <style>
    :root {
      --bg: #10131b;
      --panel: #1b2130;
      --panel-hover: #252e42;
      --border: #303849;
      --accent: #315fca;
      --accent-channel: #1f8a6b;
      --accent-focus: #6ea8ff;
      --text: #f5f6fa;
      --muted: #aeb5c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 Arial, sans-serif;
    }
    body.mode-channels {
      --active-accent: var(--accent-channel);
      --active-border: #69f0c8;
    }
    body:not(.mode-channels) {
      --active-accent: var(--accent);
      --active-border: #8bb6ff;
    }
    .wrap {
      max-width: 1280px;
      margin: auto;
      padding: 18px 18px 40px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .brand-and-modes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .logo-netflix {
      margin: 0 4px 0 0;
      font-family: "Arial Black", "Impact", Arial, sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      color: #e50914;
      text-shadow:
        1px 1px 0 #7a0309,
        2px 2px 0 #570206,
        3px 3px 0 #380104,
        0 6px 18px rgba(229, 9, 20, 0.45);
      transform: scaleY(1.12);
      user-select: none;
      white-space: nowrap;
    }
    .mode-switch {
      display: flex;
      gap: 12px;
      flex: 1;
      min-width: 280px;
      max-width: 620px;
    }
    .mode-btn {
      flex: 1;
      min-height: 58px;
      padding: 14px 24px;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s;
    }
    .mode-btn:hover, .mode-btn.focused {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      outline: none;
    }
    .mode-btn.active[data-mode="channels"] {
      background: var(--accent-channel);
      border-color: #69f0c8;
      box-shadow: 0 6px 20px rgba(31, 138, 107, .35);
    }
    .mode-btn.active[data-mode="movies"] {
      background: var(--accent);
      border-color: #8bb6ff;
      box-shadow: 0 6px 20px rgba(49, 95, 202, .35);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 7px 13px;
      width: 230px;
      max-width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box.focused,
    .search-box:focus-within {
      border-color: var(--accent-focus);
      box-shadow: 0 0 0 2px rgba(110, 168, 255, .22);
    }
    .search-icon {
      font-size: 14px;
      line-height: 1;
      opacity: .9;
      user-select: none;
    }
    .search {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s;
    }
    .tab:hover, .tab.focused {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-1px);
      outline: none;
    }
    .tab.active {
      background: var(--active-accent);
      border-color: var(--active-border);
      color: #fff;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mode-btn { font-size: 17px; padding: 12px 16px; min-height: 52px; }
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .card:hover, .card.focused {
      background: var(--panel-hover);
      border-color: var(--accent-focus);
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
      outline: none;
    }
    .poster-box {
      position: relative;
      aspect-ratio: 2 / 3;
      width: 100%;
      background: #141926;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .idx-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(16, 19, 27, .85);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      padding: 11px;
      gap: 10px;
    }
    .name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .watch {
      display: block;
      text-align: center;
      background: var(--active-accent);
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Player Overlay */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: none;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    .player-overlay.open {
      display: flex;
    }
    .player-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .player-overlay:hover .player-hud,
    .player-overlay.hud-visible .player-hud {
      opacity: 1;
    }
    .player-title {
      background: rgba(16, 19, 27, .85);
      border: 1px solid rgba(255, 255, 255, .18);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      pointer-events: auto;
    }
    .player-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .player-btn {
      background: rgba(27, 33, 48, .92);
      color: #fff;
      border: 2px solid #485675;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .player-btn:hover, .player-btn:focus {
      border-color: var(--accent-focus);
      background: var(--panel-hover);
      outline: none;
    }
    .player-btn.close-btn {
      background: #b91c1c;
      border-color: #f87171;
    }
    .player-frame-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      flex: 1;
    }
    .player-frame-wrap iframe,
    .player-frame-wrap video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body class="mode-channels">
  <main class="wrap">
    <div class="top-bar">
      <div class="brand-and-modes">
        <div class="logo-netflix" aria-label="GUINEMI">GUINEMI</div>

          <button type="button" class="mode-btn" id="btnMovies" data-mode="movies">Filmes</button>
        </div>
      </div>

      <label class="search-box" id="searchBox" for="q" aria-label="Pesquisar">
        <span class="search-icon">🔍</span>
        <input class="search" id="q" placeholder="Pesquisar..." autocomplete="off">
      </label>
    </div>

    <nav class="tabs" id="tabs" aria-label="Abas de números"></nav>

    <div class="count" id="count"></div>

    <section class="grid" id="list" aria-label="Grade de itens"></section>
  </main>

  <div class="player-overlay hud-visible" id="playerOverlay" aria-hidden="true">
    <div class="player-hud">

        <button type="button" class="player-btn close-btn" id="btnClosePlayer">Voltar (ESC)</button>

    </div>
    <div class="player-frame-wrap" id="playerFrameWrap"></div>
  </div>

    const btnToggleFs = document.getElementById("btnToggleFs");
    const btnClosePlayer = document.getElementById("btnClosePlayer");

    let currentMode = "channels";
    let activeTab = 0;
    let focusZone = "grid";
    let focusedModeIdx = 0;
    let focusedTabIdx = 0;
    let focusedCardIdx = 0;
    let isPlayerOpen = false;
    let hudTimer = null;
    let userExitedFullscreen = false;

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
    }

    function requestElFullscreen(targetEl) {
      const el = targetEl || (isPlayerOpen ? playerOverlay : document.documentElement);
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) {
        try {
          const res = req.call(el);
          if (res && typeof res.catch === "function") res.catch(() => {});
        } catch (_) {}
      }
    }

    function enterFullscreen(targetEl) {
      const desired = targetEl || (isPlayerOpen ? playerOverlay : document.documentElement);
      const currentFs = getFullscreenElement();
      if (currentFs === desired) return;
      if (currentFs && currentFs !== desired) {
        try {
          const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (exitFn) {
            const exitRes = exitFn.call(document);
            if (exitRes && typeof exitRes.then === "function") {
              exitRes.then(() => requestElFullscreen(desired)).catch(() => requestElFullscreen(desired));
              return;
            }
          }
        } catch (_) {}
      }
      requestElFullscreen(desired);
    }

    function ensureInitialOrPlayerFullscreen(force = false) {
      if (userExitedFullscreen && !force) return;
      if (isPlayerOpen) {
        enterFullscreen(playerOverlay);
      } else if (!getFullscreenElement()) {
        enterFullscreen(document.documentElement);
      }
    }

    async function exitFullscreen() {
      const currentFs = getFullscreenElement();
      if (!currentFs) return;
      try {
        const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (exitFn) {
          await exitFn.call(document);
        }
      } catch (_) {}
    }

    function showHudTemporary() {
      playerOverlay.classList.add("hud-visible");
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (isPlayerOpen) playerOverlay.classList.remove("hud-visible");
      }, 3000);
    }

    function normalizeMediaUrl(rawUrl) {
      if (!rawUrl) return CHANNEL_EMBED_URL;
      const driveMatch = rawUrl.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
      if (rawUrl.includes("sinalpublicoetv.vercel.app") && !rawUrl.includes("autoplay=")) {
        return rawUrl + (rawUrl.includes("?") ? "&autoplay=1" : "?autoplay=1");
      }
      return rawUrl;
    }

    function openMediaPlayer(item) {
      userExitedFullscreen = false;
      const embedUrl = normalizeMediaUrl(item.url);
      playerTitle.textContent = item.title;
      playerFrameWrap.innerHTML = "";

      const iframe = document.createElement("iframe");
      iframe.src = embedUrl;
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.frameBorder = "0";
      iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      iframe.allowFullscreen = true;
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("webkitallowfullscreen", "");
      iframe.setAttribute("mozallowfullscreen", "");
      playerFrameWrap.appendChild(iframe);

      playerOverlay.classList.add("open");
      playerOverlay.setAttribute("aria-hidden", "false");
      isPlayerOpen = true;
      showHudTemporary();

      // Garante tela cheia no player de canais e filmes
      enterFullscreen(playerOverlay);
    }

    async function closeMediaPlayer() {
      if (!isPlayerOpen) return;
      isPlayerOpen = false;
      clearTimeout(hudTimer);
      playerOverlay.classList.remove("open");
      playerOverlay.setAttribute("aria-hidden", "true");
      playerFrameWrap.innerHTML = "";

      if (getFullscreenElement() === playerOverlay) {
        await exitFullscreen();
      }
      applyFocusVisual();
    }

    function makeFallbackPoster(title, isChannel = false) {
      const safe = title.replace(/[<>&"]/g, "");
      const c1 = isChannel ? "#134e4a" : "#1e2942";
      const c2 = isChannel ? "#091d1c" : "#0f131d";
      const stroke = isChannel ? "#2dd4bf" : "#3b4d75";
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${c1}"/>
            <stop offset="100%" stop-color="${c2}"/>
          </linearGradient>
        </defs>
        <rect width="300" height="450" fill="url(#g)"/>
        <rect x="16" y="16" width="268" height="418" rx="12" fill="none" stroke="${stroke}" stroke-width="2"/>
        <text x="150" y="210" fill="#eef2ff" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">${safe.slice(0, 24)}</text>
        <text x="150" y="242" fill="#9fb0d6" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">${isChannel ? "CANAL AO VIVO" : "CAPA DO FILME"}</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function cleanTitleForSearch(raw) {
      const yearMatch = raw.match(/\b(19\d{2}|20\d{2})\b/);
      const year = yearMatch ? yearMatch[1] : "";
      let name = raw
        .replace(/\[[^\]]*\]|\([^)]*\)/g, " ")
        .replace(/\b(19\d{2}|20\d{2})\b/g, " ")
        .replace(/\b(O Filme|A Ameaça de Electro|O Exército Dourado|O Soldado do Inferno|A Justiça é Cinza|quebrando tudo)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
      return { name, year };
    }

    async function fetchPoster(movie) {
      if (posterCache[movie.title]) return posterCache[movie.title];
      const { name, year } = cleanTitleForSearch(movie.title);
      const params = new URLSearchParams({
        api_key: TMDB_KEY,
        query: name,
        language: "pt-BR"
      });
      if (year) params.set("year", year);

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?${params}`);
        if (!res.ok) throw new Error("tmdb_err");
        const data = await res.json();
        const hit = (data.results || []).find(m => m.poster_path) || (data.results || [])[0];
        if (hit && hit.poster_path) {
          const url = `https://image.tmdb.org/t/p/w342${hit.poster_path}`;
          posterCache[movie.title] = url;
          localStorage.setItem("tmdb_posters_v1", JSON.stringify(posterCache));
          return url;
        }
      } catch (_) {}
      return makeFallbackPoster(movie.title, false);
    }

    function getSourceList() {
      return currentMode === "channels" ? CHANNELS : MOVIES;
    }

    function getFilteredItems() {
      const term = qInput.value.trim().toLocaleLowerCase("pt-BR");
      return getSourceList()
        .map((item, idx) => ({ ...item, number: idx + 1 }))
        .filter(item => !term || item.title.toLocaleLowerCase("pt-BR").includes(term));
    }

    function getColsCount() {
      if (window.innerWidth <= 640) return 2;
      if (window.innerWidth <= 1024) return 3;
      return 5;
    }

    function switchMode(nextMode, targetCardIdx = 0, targetZone = "grid") {
      if (nextMode === currentMode) return;
      currentMode = nextMode;
      activeTab = 0;
      focusedTabIdx = 0;
      focusedCardIdx = targetCardIdx;
      focusedModeIdx = nextMode === "channels" ? 0 : 1;
      focusZone = targetZone;
      document.body.classList.toggle("mode-channels", currentMode === "channels");
      render();
    }

    function applyFocusVisual() {
      const modeBtns = [btnChannels, btnMovies];
      const tabBtns = [...tabsEl.querySelectorAll(".tab")];
      const cards = [...listEl.querySelectorAll(".card")];

      searchBoxEl.classList.toggle("focused", focusZone === "search");
      modeBtns.forEach((btn, i) => {
        btn.classList.toggle("focused", focusZone === "mode" && i === focusedModeIdx);
      });
      tabBtns.forEach((btn, i) => {
        btn.classList.toggle("focused", focusZone === "tabs" && i === focusedTabIdx);
      });
      cards.forEach((card, i) => {
        card.classList.toggle("focused", focusZone === "grid" && i === focusedCardIdx);
      });

      const target =
        focusZone === "search" ? searchBoxEl :
        focusZone === "mode" ? modeBtns[focusedModeIdx] :
        focusZone === "tabs" ? tabBtns[focusedTabIdx] :
        cards[focusedCardIdx];

      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
    }

    function render() {
      const isChannels = currentMode === "channels";
      btnChannels.classList.toggle("active", isChannels);
      btnMovies.classList.toggle("active", !isChannels);

      const filtered = getFilteredItems();
      const totalTabs = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (activeTab >= totalTabs) activeTab = 0;

      tabsEl.innerHTML = "";
      for (let t = 0; t < totalTabs; t++) {
        const start = t * PAGE_SIZE + 1;
        const end = Math.min((t + 1) * PAGE_SIZE, filtered.length);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (t === activeTab ? " active" : "");
        btn.textContent = filtered.length ? `${start}–${end}` : "1–10";
        btn.addEventListener("click", () => {
          activeTab = t;
          focusedTabIdx = t;
          focusedCardIdx = 0;
          focusZone = "grid";
          render();
        });
        btn.addEventListener("mouseenter", () => {
          focusZone = "tabs";
          focusedTabIdx = t;
          applyFocusVisual();
        });
        tabsEl.appendChild(btn);
      }

      const slice = filtered.slice(activeTab * PAGE_SIZE, (activeTab + 1) * PAGE_SIZE);
      if (focusedCardIdx >= slice.length) focusedCardIdx = Math.max(0, slice.length - 1);

      const labelSingular = isChannels ? "canal" : "filme";
      countEl.textContent = `${filtered.length} ${labelSingular}(s) • Aba ${activeTab + 1} de ${totalTabs} (${slice.length} exibidos)`;

      listEl.innerHTML = "";
      slice.forEach((item, i) => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = "#";

        const fallback = makeFallbackPoster(item.title, isChannels);
        const customCover = (item.cover || "").trim();
        const initialImg = customCover || (isChannels ? fallback : (posterCache[item.title] || fallback));

        card.innerHTML = `
          <div class="poster-box">
            <img src="${initialImg}" alt="${item.title.replace(/"/g, "&quot;")}" loading="lazy">
            <span class="idx-badge">#${item.number}</span>
          </div>
          <div class="card-body">
            <span class="name">${item.title}</span>
            <span class="watch">${isChannels ? "Assistir canal" : "Assistir"}</span>
          </div>
        `;

        card.addEventListener("click", e => {
          e.preventDefault();
          focusZone = "grid";
          focusedCardIdx = i;
          applyFocusVisual();
          openMediaPlayer(item);
        });

        const img = card.querySelector("img");
        img.addEventListener("error", () => {
          img.src = fallback;
        });
        if (!customCover && !isChannels && !posterCache[item.title]) {
          fetchPoster(item).then(src => {
            if (img.isConnected) img.src = src;
          });
        }

        card.addEventListener("mouseenter", () => {
          focusZone = "grid";
          focusedCardIdx = i;
          applyFocusVisual();
        });

        listEl.appendChild(card);
      });

      applyFocusVisual();
    }

    function setTab(nextTab) {
      const filtered = getFilteredItems();
      const totalTabs = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      activeTab = (nextTab + totalTabs) % totalTabs;
      focusedTabIdx = activeTab;
      focusedCardIdx = 0;
      render();
    }

    btnChannels.addEventListener("click", () => switchMode("channels", 0, "grid"));
    btnMovies.addEventListener("click", () => switchMode("movies", 0, "grid"));

    btnClosePlayer.addEventListener("click", () => closeMediaPlayer());
    btnToggleFs.addEventListener("click", () => {
      if (getFullscreenElement()) {
        userExitedFullscreen = true;
        exitFullscreen();
      } else {
        userExitedFullscreen = false;
        enterFullscreen(playerOverlay);
      }
    });
    playerOverlay.addEventListener("mousemove", showHudTemporary);

    qInput.addEventListener("focus", () => {
      focusZone = "search";
      applyFocusVisual();
    });

    // Entra em tela cheia no layout inicial e também ao mexer mouse, clicar ou apertar tecla
    window.addEventListener("DOMContentLoaded", () => {
      ensureInitialOrPlayerFullscreen(false);
    });
    window.addEventListener("load", () => {
      ensureInitialOrPlayerFullscreen(false);
    });
    document.addEventListener("pointermove", () => {
      ensureInitialOrPlayerFullscreen(false);
    }, { passive: true });
    document.addEventListener("pointerdown", () => {
      ensureInitialOrPlayerFullscreen(false);
    }, { passive: true });

    document.addEventListener("fullscreenchange", () => {
      if (!getFullscreenElement() && !isPlayerOpen) {
        userExitedFullscreen = true;
      } else if (getFullscreenElement()) {
        userExitedFullscreen = false;
      }
    });

    document.addEventListener("keydown", e => {
      if (!isPlayerOpen && e.key !== "Escape") {
        ensureInitialOrPlayerFullscreen(false);
      }

      if (isPlayerOpen) {
        showHudTemporary();
        if (e.key === "Escape" || e.key === "Backspace") {
          e.preventDefault();
          closeMediaPlayer();
        } else if (e.key.toLowerCase() === "f") {
          e.preventDefault();
          if (getFullscreenElement()) {
            userExitedFullscreen = true;
            exitFullscreen();
          } else {
            userExitedFullscreen = false;
            enterFullscreen(playerOverlay);
          }
        }
        return;
      }

      if (document.activeElement === qInput) {
        if (e.key === "ArrowDown" || e.key === "Escape") {
          e.preventDefault();
          qInput.blur();
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
        }
        return;
      }

      const tabBtns = [...tabsEl.querySelectorAll(".tab")];
      const cards = [...listEl.querySelectorAll(".card")];
      const cols = getColsCount();

      if (focusZone === "search") {
        if (e.key === "Enter") {
          e.preventDefault();
          qInput.focus();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = 1;
          applyFocusVisual();
        }
        return;
      }

      if (focusZone === "mode") {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          if (focusedModeIdx === 0) {
            focusedModeIdx = 1;
            applyFocusVisual();
          } else {
            focusZone = "search";
            applyFocusVisual();
          }
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (focusedModeIdx === 1) {
            focusedModeIdx = 0;
            applyFocusVisual();
          } else {
            switchMode(currentMode === "movies" ? "channels" : "movies", 0, "mode");
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          focusZone = "search";
          applyFocusVisual();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          focusZone = "tabs";
          focusedTabIdx = activeTab;
          applyFocusVisual();
        } else if (e.key === "Enter") {
          e.preventDefault();
          switchMode(focusedModeIdx === 0 ? "channels" : "movies", 0, "grid");
        }
        return;
      }

      if (focusZone === "tabs") {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          focusedTabIdx = Math.min(tabBtns.length - 1, focusedTabIdx + 1);
          applyFocusVisual();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (focusedTabIdx > 0) {
            focusedTabIdx--;
            applyFocusVisual();
          } else {
            switchMode(currentMode === "movies" ? "channels" : "movies", 0, "tabs");
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          activeTab = focusedTabIdx;
          focusZone = "grid";
          focusedCardIdx = 0;
          render();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
        } else if (e.key === "Enter") {
          e.preventDefault();
          activeTab = focusedTabIdx;
          focusZone = "grid";
          focusedCardIdx = 0;
          render();
        }
        return;
      }

      if (!cards.length) return;
      const currentCol = focusedCardIdx % cols;

      if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (currentCol === 0) {
          switchMode(currentMode === "movies" ? "channels" : "movies", 0, "grid");
        } else {
          focusedCardIdx--;
          applyFocusVisual();
        }
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        if (focusedCardIdx + 1 < cards.length) {
          focusedCardIdx++;
          applyFocusVisual();
        } else {
          setTab(activeTab + 1);
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (focusedCardIdx + cols < cards.length) {
          focusedCardIdx += cols;
          applyFocusVisual();
        } else {
          setTab(activeTab + 1);
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (focusedCardIdx - cols >= 0) {
          focusedCardIdx -= cols;
          applyFocusVisual();
        } else {
          focusZone = "tabs";
          focusedTabIdx = activeTab;
          applyFocusVisual();
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        const filtered = getFilteredItems();
        const slice = filtered.slice(activeTab * PAGE_SIZE, (activeTab + 1) * PAGE_SIZE);
        const item = slice[focusedCardIdx];
        if (item) {
          openMediaPlayer(item);
        }
      }
    });

    qInput.addEventListener("input", () => {
      activeTab = 0;
      focusedCardIdx = 0;
      render();
    });

    window.addEventListener("resize", applyFocusVisual);
    render();
    ensureInitialOrPlayerFullscreen(false);
  </script>
</body>
</html>
