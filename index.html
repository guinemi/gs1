<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GUINEMI</title>
  <style>
    :root {
      --bg: #10131b;
      --panel: #1b2130;
      --panel-hover: #252e42;
      --border: #303849;
      --accent: #315fca;
      --accent-channel: #1f8a6b;
      --accent-focus: #6ea8ff;
      --text: #f5f6fa;
      --muted: #aeb5c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10131b;
      background: var(--bg);
      color: #f5f6fa;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.4;
    }
    body.mode-channels {
      --active-accent: #1f8a6b;
      --active-border: #69f0c8;
    }
    body:not(.mode-channels) {
      --active-accent: #315fca;
      --active-border: #8bb6ff;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }
    .top-bar {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand-and-modes {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      -webkit-align-items: center;
      align-items: center;
      -webkit-flex: 1;
      flex: 1;
    }
    .logo-netflix {
      margin: 0 16px 8px 0;
      font-family: "Arial Black", Impact, Arial, sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      color: #e50914;
      text-shadow: 2px 2px 0 #570206, 0 6px 18px rgba(229, 9, 20, 0.45);
      white-space: nowrap;
    }
    .mode-switch {
      display: -webkit-flex;
      display: flex;
      -webkit-flex: 1;
      flex: 1;
      min-width: 280px;
      max-width: 620px;
      margin-bottom: 8px;
    }
    .mode-btn {
      -webkit-flex: 1;
      flex: 1;
      min-height: 58px;
      padding: 14px 20px;
      margin-right: 12px;
      background: #1b2130;
      background: var(--panel);
      color: #f5f6fa;
      color: var(--text);
      border: 2px solid #303849;
      border-color: var(--border);
      border-radius: 14px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn:last-child { margin-right: 0; }
    .mode-btn:hover, .mode-btn.focused {
      background: #252e42;
      background: var(--panel-hover);
      border-color: #6ea8ff;
      border-color: var(--accent-focus);
      outline: none;
    }
    .mode-btn.active[data-mode="channels"] {
      background: #1f8a6b;
      background: var(--accent-channel);
      border-color: #69f0c8;
    }
    .mode-btn.active[data-mode="movies"] {
      background: #315fca;
      background: var(--accent);
      border-color: #8bb6ff;
    }
    .search-box {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      background: #1b2130;
      background: var(--panel);
      border: 2px solid #303849;
      border-color: var(--border);
      border-radius: 999px;
      padding: 7px 13px;
      width: 230px;
      max-width: 100%;
      margin-bottom: 8px;
    }
    .search-box.focused,
    .search-box:focus-within {
      border-color: #6ea8ff;
      border-color: var(--accent-focus);
    }
    .search-icon {
      font-size: 14px;
      line-height: 1;
      margin-right: 8px;
    }
    .search {
      width: 100%;
      border: 0;
      background: transparent;
      color: #f5f6fa;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .tabs {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .tab {
      background: #1b2130;
      background: var(--panel);
      color: #f5f6fa;
      color: var(--text);
      border: 1px solid #303849;
      border-color: var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      margin: 0 8px 8px 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab:hover, .tab.focused {
      background: #252e42;
      background: var(--panel-hover);
      border-color: #6ea8ff;
      border-color: var(--accent-focus);
      outline: none;
    }
    body.mode-channels .tab.active {
      background: #1f8a6b;
      border-color: #69f0c8;
      color: #fff;
    }
    body:not(.mode-channels) .tab.active {
      background: #315fca;
      border-color: #8bb6ff;
      color: #fff;
    }
    .count {
      color: #aeb5c4;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .grid {
      overflow: hidden;
      margin-left: -7px;
      margin-right: -7px;
    }
    .card {
      float: left;
      width: 20%;
      padding: 0 7px 14px;
      color: #f5f6fa;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .card-inner {
      display: block;
      background: #1b2130;
      background: var(--panel);
      border: 2px solid #303849;
      border-color: var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card:hover .card-inner, .card.focused .card-inner {
      background: #252e42;
      background: var(--panel-hover);
      border-color: #6ea8ff;
      border-color: var(--accent-focus);
      outline: none;
    }
    @media (max-width: 1024px) {
      .card { width: 33.3333%; }
    }
    @media (max-width: 640px) {
      .card { width: 50%; }
      .mode-btn { font-size: 17px; padding: 12px 14px; min-height: 52px; }
    }
    .poster-box {
      position: relative;
      width: 100%;
      padding-top: 150%;
      background: #141926;
      overflow: hidden;
    }
    .poster-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .idx-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(16, 19, 27, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      z-index: 2;
    }
    .card-body {
      padding: 11px;
    }
    .name {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      height: 34px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .watch {
      display: block;
      text-align: center;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    body.mode-channels .watch { background: #1f8a6b; }
    body:not(.mode-channels) .watch { background: #315fca; }

    /* Player Modal compatível com browsers antigos de TV */
    #tvPlayerModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 14, 0.96);
      z-index: 9999;
      padding: 16px;
    }
    #tvPlayerModal.open {
      display: block;
    }
    .tv-player-box {
      max-width: 1120px;
      margin: 0 auto;
      background: #141926;
      border: 2px solid #3c4b6e;
      border-radius: 14px;
      padding: 14px;
    }
    .tv-player-header {
      overflow: hidden;
      margin-bottom: 12px;
    }
    .tv-player-title {
      float: left;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      line-height: 40px;
      max-width: 68%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tv-player-actions {
      float: right;
    }
    .tv-btn {
      display: inline-block;
      background: #252e42;
      color: #ffffff;
      border: 2px solid #526794;
      border-radius: 8px;
      padding: 8px 14px;
      margin-left: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .tv-btn:hover, .tv-btn.focused {
      background: #315fca;
      border-color: #8bb6ff;
      outline: none;
    }
    .tv-btn.close-btn {
      background: #8f1d24;
      border-color: #ff6b74;
    }
    .tv-btn.close-btn:hover, .tv-btn.close-btn.focused {
      background: #b8232d;
      border-color: #ffa3a8;
    }
    .tv-media-stage {
      position: relative;
      width: 100%;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      min-height: 320px;
      height: 62vh;
    }
    #tvVideo, #tvFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000000;
    }
    #tvStatus {
      margin-top: 10px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
    }
  </style>
</head>
<body class="mode-channels">
  <main class="wrap">
    <div class="top-bar">
      <div class="brand-and-modes">
        <div class="logo-netflix" aria-label="GUINEMI">GUINEMI</div>
        <div class="mode-switch" role="tablist" aria-label="Canais e Filmes">
          <button type="button" class="mode-btn active" id="btnChannels" data-mode="channels">Canais</button>
          <button type="button" class="mode-btn" id="btnMovies" data-mode="movies">Filmes</button>
        </div>
      </div>

      <label class="search-box" id="searchBox" for="q" aria-label="Pesquisar">
        <span class="search-icon">🔍</span>
        <input class="search" id="q" placeholder="Pesquisar..." autocomplete="off">
      </label>
    </div>

    <nav class="tabs" id="tabs" aria-label="Abas de números"></nav>

    <div class="count" id="count"></div>

    <section class="grid" id="list" aria-label="Grade de itens"></section>

    <div id="tvPlayerModal" role="dialog" aria-modal="true" aria-labelledby="tvPlayerTitle">
      <div class="tv-player-box">
        <div class="tv-player-header">
          <div class="tv-player-title" id="tvPlayerTitle">Player</div>
          <div class="tv-player-actions">
            <button type="button" class="tv-btn focused" id="tvPlayPauseBtn">Play / Pause</button>
            <a class="tv-btn" id="tvExternalLink" href="#">Abrir fora</a>
            <button type="button" class="tv-btn close-btn" id="tvCloseBtn">Fechar (Voltar)</button>
          </div>
        </div>
        <div class="tv-media-stage">
          <video id="tvVideo" controls="controls" playsinline="playsinline" preload="metadata"></video>
          <iframe id="tvFrame" allowfullscreen="allowfullscreen" scrolling="no"></iframe>
        </div>
        <div id="tvStatus">Setas Esquerda/Direita: -10s / +10s • Enter: Play/Pause • Voltar/Esc: Fechar</div>
      </div>
    </div>
  </main>

      { title: "Kick Ass 2 2014", cover: "", url: "https://drive.google.com/file/d/1xsmu0ZCN9Qz0kyTldghIusz2PMfLU6a3" },
      { title: "Kick Ass quebrando tudo 2011", cover: "", url: "https://drive.google.com/file/d/18X-DIXqDqQ6cyhj2exJgm6mMi0PgKspq" }
    ];

    var MOVIES = FANTASIA_MOVIES.concat(TERROR_MOVIES, BASE_MOVIES);

    var PAGE_SIZE = 10;
    var TMDB_KEY = "8265bd1679663a7ea12ac168da84d2e8";
    var posterCache = {};
    try {
      posterCache = JSON.parse(window.localStorage.getItem("tmdb_posters_v1") || "{}");
    } catch (e) {
      posterCache = {};

    var searchBoxEl = document.getElementById("searchBox");
    var qInput = document.getElementById("q");
    var tabsEl = document.getElementById("tabs");
    var listEl = document.getElementById("list");
    var countEl = document.getElementById("count");
    var btnChannels = document.getElementById("btnChannels");
    var btnMovies = document.getElementById("btnMovies");

    var modalEl = document.getElementById("tvPlayerModal");
    var modalTitleEl = document.getElementById("tvPlayerTitle");
    var videoEl = document.getElementById("tvVideo");
    var frameEl = document.getElementById("tvFrame");
    var statusEl = document.getElementById("tvStatus");
    var playPauseBtn = document.getElementById("tvPlayPauseBtn");
    var extLinkEl = document.getElementById("tvExternalLink");
    var closeBtn = document.getElementById("tvCloseBtn");

    var currentMode = "channels";
    var activeTab = 0;
    var focusZone = "grid";
    var focusedModeIdx = 0;
    var focusedTabIdx = 0;
    var focusedCardIdx = 0;
    var isPlayerOpen = false;

    function escapeXml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makeFallbackPoster(title, isChannel) {
      var safe = escapeXml(title).slice(0, 24);
      var c1 = isChannel ? "#134e4a" : "#1e2942";
      var c2 = isChannel ? "#091d1c" : "#0f131d";
      var stroke = isChannel ? "#2dd4bf" : "#3b4d75";
      var label = isChannel ? "CANAL AO VIVO" : "CAPA DO FILME";
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">' +
        '<rect width="300" height="450" fill="' + c1 + '"/>' +
        '<rect x="16" y="16" width="268" height="418" rx="12" fill="none" stroke="' + stroke + '" stroke-width="2"/>' +
        '<rect x="0" y="230" width="300" height="220" fill="' + c2 + '"/>' +
        '<text x="150" y="210" fill="#eef2ff" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">' + safe + '</text>' +
        '<text x="150" y="242" fill="#9fb0d6" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">' + label + '</text>' +
        '</svg>';
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function cleanTitleForSearch(raw) {
      var yearMatch = String(raw || "").match(/(19\d{2}|20\d{2})/);
      var year = yearMatch ? yearMatch[1] : "";
      var name = String(raw || "")
        .replace(/\[[^\]]*\]|\([^)]*\)/g, " ")
        .replace(/(19\d{2}|20\d{2})/g, " ")
        .replace(/(O Filme|A Ameaça de Electro|O Exército Dourado|O Soldado do Inferno|A Justiça é Cinza|quebrando tudo)/gi, " ")
        .replace(/\s+/g, " ")
        .replace(/^\s+|\s+$/g, "");
      return { name: name, year: year };
    }

    function fetchPoster(movie, callback) {
      if (posterCache[movie.title]) {
        callback(posterCache[movie.title]);
        return;
      }
      var parsed = cleanTitleForSearch(movie.title);
      var url = "https://api.themoviedb.org/3/search/movie?api_key=" +
        encodeURIComponent(TMDB_KEY) +
        "&query=" + encodeURIComponent(parsed.name) +
        "&language=pt-BR" +
        (parsed.year ? "&year=" + encodeURIComponent(parsed.year) : "");

      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var data = JSON.parse(xhr.responseText);
                var results = data.results || [];
                var hit = null;
                for (var i = 0; i < results.length; i++) {
                  if (results[i] && results[i].poster_path) {
                    hit = results[i];
                    break;
                  }
                }
                if (!hit && results.length > 0) hit = results[0];
                if (hit && hit.poster_path) {
                  var posterUrl = "https://image.tmdb.org/t/p/w342" + hit.poster_path;
                  posterCache[movie.title] = posterUrl;
                  try {
                    window.localStorage.setItem("tmdb_posters_v1", JSON.stringify(posterCache));
                  } catch (e) {}
                  callback(posterUrl);
                }
              } catch (e) {}
            }
          }
        };
        xhr.send(null);
      } catch (e) {}
    }

    function getSourceList() {
      return currentMode === "channels" ? CHANNELS : MOVIES;
    }

    function getFilteredItems() {
      var term = String(qInput.value || "").replace(/^\s+|\s+$/g, "").toLowerCase();
      var src = getSourceList();
      var out = [];
      for (var i = 0; i < src.length; i++) {
        var item = src[i];
        var titleLower = String(item.title || "").toLowerCase();
        if (!term || titleLower.indexOf(term) !== -1) {
          out.push({
            title: item.title,
            cover: item.cover,
            url: item.url,
            number: i + 1
          });
        }
      }
      return out;
    }

    function getColsCount() {
      var w = window.innerWidth || document.documentElement.clientWidth || 1280;
      if (w <= 640) return 2;
      if (w <= 1024) return 3;
      return 5;
    }

    function isDirectVideoUrl(url) {
      return /\.(mp4|webm|m4v|ogg)(\?|#|$)/i.test(String(url || ""));
    }

    function toEmbedUrl(url) {
      var raw = String(url || "");
      var driveMatch = raw.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/i);
      if (driveMatch && driveMatch[1]) {
        return "https://drive.google.com/file/d/" + driveMatch[1] + "/preview";
      }
      return raw;
    }

    function setPlayerMediaMode(mode) {
      if (mode === "video") {
        videoEl.style.display = "block";
        frameEl.style.display = "none";
        frameEl.src = "about:blank";
        playPauseBtn.style.display = "inline-block";
      } else if (mode === "frame") {
        videoEl.pause();
        videoEl.removeAttribute("src");
        videoEl.load();
        videoEl.style.display = "none";
        frameEl.style.display = "block";
        playPauseBtn.style.display = "none";
      } else {
        videoEl.pause();
        videoEl.removeAttribute("src");
        videoEl.load();
        videoEl.style.display = "none";
        frameEl.style.display = "none";
        frameEl.src = "about:blank";
        playPauseBtn.style.display = "none";
      }
    }

    function openTvPlayer(item) {
      if (!item) return;
      var rawUrl = String(item.url || "").replace(/^\s+|\s+$/g, "");
      isPlayerOpen = true;
      modalFocusIdx = 0;
      modalTitleEl.textContent = (item.number ? "#" + item.number + " - " : "") + item.title;
      extLinkEl.href = rawUrl && rawUrl.indexOf("#") !== 0 ? rawUrl : "#";
      modalEl.className = "open";
      modalEl.style.display = "block";

      if (!rawUrl || rawUrl.indexOf("#") === 0) {
        setPlayerMediaMode("none");
        statusEl.textContent = "Este item ainda está sem link de stream configurado (" + (rawUrl || "vazio") + "). Use Fechar (Voltar) para sair.";
        applyModalFocusVisual();
        return;
      }

      if (isDirectVideoUrl(rawUrl)) {
        setPlayerMediaMode("video");
        statusEl.textContent = "Carregando vídeo direto na TV...";
        try {
          videoEl.src = rawUrl;
          videoEl.load();
          var playPromise = videoEl.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise.then(function () {
              statusEl.textContent = "Reproduzindo • Setas Esquerda/Direita: -10s / +10s • Voltar/Esc: Fechar";
            }).catch(function () {
              statusEl.textContent = "Pressione Play ou Enter no controle para iniciar o vídeo.";
            });
          } else {
            statusEl.textContent = "Player pronto • Pressione Play/Enter se não iniciar sozinho.";
          }
        } catch (e) {
          statusEl.textContent = "Falha ao iniciar player nativo. Tente 'Abrir fora' ou 'Fechar (Voltar)'.";
        }
      } else {
        setPlayerMediaMode("frame");
        var embedUrl = toEmbedUrl(rawUrl);
        statusEl.textContent = "Carregando player externo na tela... Se a TV bloquear o embed, use 'Abrir fora' ou 'Fechar (Voltar)'.";
        try {
          frameEl.src = embedUrl;
        } catch (e) {
          statusEl.textContent = "Este navegador de TV bloqueou o embed. Use 'Abrir fora' ou 'Fechar (Voltar)'.";
        }
      }

      applyModalFocusVisual();
    }

    function closeTvPlayer() {
      isPlayerOpen = false;
      setPlayerMediaMode("none");
      modalEl.className = "";
      modalEl.style.display = "none";
      applyFocusVisual();
    }

    function getModalFocusableButtons() {
      var list = [];
      if (playPauseBtn.style.display !== "none") list.push(playPauseBtn);
      list.push(extLinkEl);
      list.push(closeBtn);
      return list;
    }

    function applyModalFocusVisual() {
      var btns = getModalFocusableButtons();
      if (modalFocusIdx >= btns.length) modalFocusIdx = 0;
      if (modalFocusIdx < 0) modalFocusIdx = btns.length - 1;
      for (var i = 0; i < btns.length; i++) {
        if (i === modalFocusIdx) {
          btns[i].className = btns[i].className.replace(/focused/g, "") + " focused";
          try { btns[i].focus(); } catch (e) {}
        } else {
          btns[i].className = btns[i].className.replace(/\s*focused/g, "");
        }
      }
    }

    function togglePlayPause() {
      if (videoEl.style.display !== "none") {
        if (videoEl.paused) {
          try { videoEl.play(); } catch (e) {}
          statusEl.textContent = "Reproduzindo • Setas Esquerda/Direita: -10s / +10s";
        } else {
          try { videoEl.pause(); } catch (e) {}
          statusEl.textContent = "Pausado • Pressione Enter/Play para continuar";
        }
      }
    }

    function switchMode(nextMode, targetCardIdx, targetZone) {
      if (nextMode === currentMode) return;
      currentMode = nextMode;
      activeTab = 0;
      focusedTabIdx = 0;
      focusedCardIdx = typeof targetCardIdx === "number" ? targetCardIdx : 0;
      focusedModeIdx = nextMode === "channels" ? 0 : 1;
      focusZone = targetZone || "grid";
      document.body.className = currentMode === "channels" ? "mode-channels" : "";
      render();
    }

    function applyFocusVisual() {
      if (isPlayerOpen) {
        applyModalFocusVisual();
        return;
      }
      var modeBtns = [btnChannels, btnMovies];
      var tabBtns = tabsEl.getElementsByTagName("button");
      var cards = listEl.getElementsByTagName("a");

      searchBoxEl.className = searchBoxEl.className.replace(/\s*focused/g, "") + (focusZone === "search" ? " focused" : "");

      for (var m = 0; m < modeBtns.length; m++) {
        var baseM = modeBtns[m].className.replace(/\s*focused/g, "");
        modeBtns[m].className = baseM + (focusZone === "mode" && m === focusedModeIdx ? " focused" : "");
      }

      for (var t = 0; t < tabBtns.length; t++) {
        var baseT = tabBtns[t].className.replace(/\s*focused/g, "");
        tabBtns[t].className = baseT + (focusZone === "tabs" && t === focusedTabIdx ? " focused" : "");
      }

      for (var c = 0; c < cards.length; c++) {
        var baseC = cards[c].className.replace(/\s*focused/g, "");
        cards[c].className = baseC + (focusZone === "grid" && c === focusedCardIdx ? " focused" : "");
      }

      var target = null;
      if (focusZone === "search") target = qInput;
      else if (focusZone === "mode") target = modeBtns[focusedModeIdx];
      else if (focusZone === "tabs") target = tabBtns[focusedTabIdx];
      else if (focusZone === "grid") target = cards[focusedCardIdx];

      if (target && typeof target.scrollIntoView === "function") {
        try { target.scrollIntoView(false); } catch (e) {}
      }
    }

    function render() {
      var isChannels = currentMode === "channels";
      btnChannels.className = "mode-btn" + (isChannels ? " active" : "");
      btnMovies.className = "mode-btn" + (!isChannels ? " active" : "");

      var filtered = getFilteredItems();
      var totalTabs = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (activeTab >= totalTabs) activeTab = 0;

      tabsEl.innerHTML = "";
      for (var t = 0; t < totalTabs; t++) {
        (function (tabIndex) {
          var start = tabIndex * PAGE_SIZE + 1;
          var end = Math.min((tabIndex + 1) * PAGE_SIZE, filtered.length);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab" + (tabIndex === activeTab ? " active" : "");
          btn.appendChild(document.createTextNode(filtered.length ? (start + "–" + end) : "1–10"));
          btn.onclick = function () {
            activeTab = tabIndex;
            focusedTabIdx = tabIndex;
            focusedCardIdx = 0;
            focusZone = "grid";
            render();
          };
          btn.onmouseover = function () {
            focusZone = "tabs";
            focusedTabIdx = tabIndex;
            applyFocusVisual();
          };
          tabsEl.appendChild(btn);
        })(t);
      }

      var slice = filtered.slice(activeTab * PAGE_SIZE, (activeTab + 1) * PAGE_SIZE);
      if (focusedCardIdx >= slice.length) focusedCardIdx = Math.max(0, slice.length - 1);

      var labelSingular = isChannels ? "canal" : "filme";
      countEl.innerHTML = "";
      countEl.appendChild(document.createTextNode(
        filtered.length + " " + labelSingular + "(s) • Aba " + (activeTab + 1) + " de " + totalTabs + " (" + slice.length + " exibidos)"
      ));

      listEl.innerHTML = "";
      for (var i = 0; i < slice.length; i++) {
        (function (item, idx) {
          var linkHref = item.url || "#";
          var card = document.createElement("a");
          card.className = "card";
          card.href = linkHref;

          var fallback = makeFallbackPoster(item.title, isChannels);
          var customCover = String(item.cover || "").replace(/^\s+|\s+$/g, "");
          var initialImg = customCover || (isChannels ? fallback : (posterCache[item.title] || fallback));

          var inner = document.createElement("span");
          inner.className = "card-inner";

          var posterBox = document.createElement("span");
          posterBox.className = "poster-box";

          var img = document.createElement("img");
          img.src = initialImg;
          img.alt = item.title;
          img.onerror = function () {
            img.onerror = null;
            img.src = fallback;
          };

          var badge = document.createElement("span");
          badge.className = "idx-badge";
          badge.appendChild(document.createTextNode("#" + item.number));

          posterBox.appendChild(img);
          posterBox.appendChild(badge);

          var body = document.createElement("span");
          body.className = "card-body";

          var nameSpan = document.createElement("span");
          nameSpan.className = "name";
          nameSpan.appendChild(document.createTextNode(item.title));

          var watchSpan = document.createElement("span");
          watchSpan.className = "watch";
          watchSpan.appendChild(document.createTextNode(isChannels ? "Abrir canal" : "Assistir"));

          body.appendChild(nameSpan);
          body.appendChild(watchSpan);

          inner.appendChild(posterBox);
          inner.appendChild(body);
          card.appendChild(inner);

          card.onclick = function (ev) {
            if (ev && ev.preventDefault) ev.preventDefault();
            openTvPlayer(item);
            return false;
          };

          card.onmouseover = function () {
            focusZone = "grid";
            focusedCardIdx = idx;
            applyFocusVisual();
          };

          if (!customCover && !isChannels && !posterCache[item.title]) {
            fetchPoster(item, function (src) {
              if (img && img.parentNode) img.src = src;
            });
          }

          listEl.appendChild(card);
        })(slice[i], i);
      }

      applyFocusVisual();
    }

    function setTab(nextTab) {
      var filtered = getFilteredItems();
      var totalTabs = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      activeTab = ((nextTab % totalTabs) + totalTabs) % totalTabs;
      focusedTabIdx = activeTab;
      focusedCardIdx = 0;
      render();
    }

    function handleKeyDown(e) {
      e = e || window.event;
      var key = e.key || "";
      var code = e.keyCode || e.which || 0;

      var isLeft = key === "ArrowLeft" || key === "Left" || code === 37;
      var isRight = key === "ArrowRight" || key === "Right" || code === 39;
      var isUp = key === "ArrowUp" || key === "Up" || code === 38;
      var isDown = key === "ArrowDown" || key === "Down" || code === 40;
      var isEnter = key === "Enter" || code === 13;
      var isBackOrEsc = key === "Escape" || key === "Esc" || key === "Backspace" || key === "GoBack" || key === "BrowserBack" || code === 27 || code === 8 || code === 461 || code === 10009;

      if (isPlayerOpen) {
        if (isBackOrEsc) {
          if (e.preventDefault) e.preventDefault();
          closeTvPlayer();
          return false;
        }
        if (isLeft) {
          if (e.preventDefault) e.preventDefault();
          if (videoEl.style.display !== "none") {
            try { videoEl.currentTime = Math.max(0, (videoEl.currentTime || 0) - 10); } catch (err) {}
          } else {
            modalFocusIdx--;
            applyModalFocusVisual();
          }
          return false;
        }
        if (isRight) {
          if (e.preventDefault) e.preventDefault();
          if (videoEl.style.display !== "none") {
            try { videoEl.currentTime = (videoEl.currentTime || 0) + 10; } catch (err) {}
          } else {
            modalFocusIdx++;
            applyModalFocusVisual();
          }
          return false;
        }
        if (isUp || isDown) {
          if (e.preventDefault) e.preventDefault();
          modalFocusIdx = isDown ? modalFocusIdx + 1 : modalFocusIdx - 1;
          applyModalFocusVisual();
          return false;
        }
        if (isEnter) {
          var mBtns = getModalFocusableButtons();
          var focusedBtn = mBtns[modalFocusIdx];
          if (focusedBtn === closeBtn) {
            if (e.preventDefault) e.preventDefault();
            closeTvPlayer();
            return false;
          }
          if (focusedBtn === playPauseBtn) {
            if (e.preventDefault) e.preventDefault();
            togglePlayPause();
            return false;
          }
          if (focusedBtn === extLinkEl) {
            return true;
          }
        }
        return true;
      }

      if (document.activeElement === qInput) {
        if (isDown || isBackOrEsc) {
          if (e.preventDefault) e.preventDefault();
          try { qInput.blur(); } catch (err) {}
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
          return false;
        }
        return true;
      }

      var tabBtns = tabsEl.getElementsByTagName("button");
      var cards = listEl.getElementsByTagName("a");
      var cols = getColsCount();

      if (focusZone === "search") {
        if (isEnter) {
          if (e.preventDefault) e.preventDefault();
          try { qInput.focus(); } catch (err) {}
          return false;
        } else if (isDown) {
          if (e.preventDefault) e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
          return false;
        } else if (isLeft) {
          if (e.preventDefault) e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = 1;
          applyFocusVisual();
          return false;
        }
        return true;
      }

      if (focusZone === "mode") {
        if (isRight) {
          if (e.preventDefault) e.preventDefault();
          if (focusedModeIdx === 0) {
            focusedModeIdx = 1;
            applyFocusVisual();
          } else {
            focusZone = "search";
            applyFocusVisual();
          }
          return false;
        } else if (isLeft) {
          if (e.preventDefault) e.preventDefault();
          if (focusedModeIdx === 1) {
            focusedModeIdx = 0;
            applyFocusVisual();
          } else {
            switchMode(currentMode === "movies" ? "channels" : "movies", 0, "mode");
          }
          return false;
        } else if (isUp) {
          if (e.preventDefault) e.preventDefault();
          focusZone = "search";
          applyFocusVisual();
          return false;
        } else if (isDown) {
          if (e.preventDefault) e.preventDefault();
          focusZone = "tabs";
          focusedTabIdx = activeTab;
          applyFocusVisual();
          return false;
        } else if (isEnter) {
          if (e.preventDefault) e.preventDefault();
          switchMode(focusedModeIdx === 0 ? "channels" : "movies", 0, "grid");
          return false;
        }
        return true;
      }

      if (focusZone === "tabs") {
        if (isRight) {
          if (e.preventDefault) e.preventDefault();
          focusedTabIdx = Math.min(tabBtns.length - 1, focusedTabIdx + 1);
          applyFocusVisual();
          return false;
        } else if (isLeft) {
          if (e.preventDefault) e.preventDefault();
          if (focusedTabIdx > 0) {
            focusedTabIdx--;
            applyFocusVisual();
          } else {
            switchMode(currentMode === "movies" ? "channels" : "movies", 0, "tabs");
          }
          return false;
        } else if (isDown) {
          if (e.preventDefault) e.preventDefault();
          activeTab = focusedTabIdx;
          focusZone = "grid";
          focusedCardIdx = 0;
          render();
          return false;
        } else if (isUp) {
          if (e.preventDefault) e.preventDefault();
          focusZone = "mode";
          focusedModeIdx = currentMode === "channels" ? 0 : 1;
          applyFocusVisual();
          return false;
        } else if (isEnter) {
          if (e.preventDefault) e.preventDefault();
          activeTab = focusedTabIdx;
          focusZone = "grid";
          focusedCardIdx = 0;
          render();
          return false;
        }
        return true;
      }

      if (!cards.length) return true;
      var currentCol = focusedCardIdx % cols;

      if (isLeft) {
        if (e.preventDefault) e.preventDefault();
        if (currentCol === 0) {
          switchMode(currentMode === "movies" ? "channels" : "movies", 0, "grid");
        } else {
          focusedCardIdx--;
          applyFocusVisual();
        }
        return false;
      } else if (isRight) {
        if (e.preventDefault) e.preventDefault();
        if (focusedCardIdx + 1 < cards.length) {
          focusedCardIdx++;
          applyFocusVisual();
        } else {
          setTab(activeTab + 1);
        }
        return false;
      } else if (isDown) {
        if (e.preventDefault) e.preventDefault();
        if (focusedCardIdx + cols < cards.length) {
          focusedCardIdx += cols;
          applyFocusVisual();
        } else {
          setTab(activeTab + 1);
        }
        return false;
      } else if (isUp) {
        if (e.preventDefault) e.preventDefault();
        if (focusedCardIdx - cols >= 0) {
          focusedCardIdx -= cols;
          applyFocusVisual();
        } else {
          focusZone = "tabs";
          focusedTabIdx = activeTab;
          applyFocusVisual();
        }
        return false;
      } else if (isEnter) {
        if (e.preventDefault) e.preventDefault();
        var slice = getFilteredItems().slice(activeTab * PAGE_SIZE, (activeTab + 1) * PAGE_SIZE);
        var chosen = slice[focusedCardIdx];
        if (chosen) {
          openTvPlayer(chosen);
        }
        return false;
      }
      return true;
    }

    btnChannels.onclick = function () { switchMode("channels", 0, "grid"); };
    btnMovies.onclick = function () { switchMode("movies", 0, "grid"); };
    qInput.onfocus = function () {
      focusZone = "search";
      applyFocusVisual();
    };
    qInput.oninput = function () {
      activeTab = 0;
      focusedCardIdx = 0;
      render();
    };
    playPauseBtn.onclick = function () { togglePlayPause(); };
    closeBtn.onclick = function () { closeTvPlayer(); };

    if (document.addEventListener) {
      document.addEventListener("keydown", handleKeyDown, false);
      window.addEventListener("resize", applyFocusVisual, false);
    } else if (document.attachEvent) {
      document.attachEvent("onkeydown", handleKeyDown);
      window.attachEvent("onresize", applyFocusVisual);
    }

    render();
  </script>
</body>
</html>
