<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUINEMI GS</title>
  <style>
    :root {
      --bg-dark: #141414;
      --bg-card: #1f1f1f;
      --accent: #e50914;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --focus-ring: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      user-select: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.96) 0%, rgba(20, 20, 20, 0.88) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .num-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn,
    .num-btn {
      background: #242424;
      color: var(--text-muted);
      border: 3px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      font-weight: 700;
      transition: transform 0.14s ease, background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .tab-btn {
      padding: 10px 22px;
      font-size: 18px;
    }

    .num-btn {
      width: 44px;
      height: 44px;
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tab-btn.active,
    .num-btn.active {
      background: #2f2f2f;
      color: var(--text-main);
      border-bottom: 4px solid var(--accent);
    }

    .tab-btn:focus,
    .tab-btn.tv-focused,
    .num-btn:focus,
    .num-btn.tv-focused {
      background: #ffffff;
      color: #000000;
      border-color: var(--accent);
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.45);
    }

    main {
      position: fixed;
      top: 76px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 76px);
      padding: 20px 36px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-9 {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 18px 22px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background-color: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 3px solid transparent;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: flex-end;
      text-align: left;
      touch-action: manipulation;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform 0.22s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 30%,
        rgba(0, 0, 0, 0.72) 78%,
        rgba(0, 0, 0, 0.94) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .card-info {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(229, 9, 20, 0.92);
      color: #ffffff;
    }

    .card.empty-slot {
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed rgba(255, 255, 255, 0.12);
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .card.empty-slot::after {
      display: none;
    }

    .card.empty-slot span {
      color: rgba(255, 255, 255, 0.25);
      font-size: 15px;
      font-weight: 600;
    }

    .card:focus,
    .card.tv-focused {
      border-color: var(--focus-ring);
      transform: scale(1.03);
      box-shadow: 0 0 0 3px var(--accent), 0 14px 32px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    .card:focus img,
    .card.tv-focused img {
      transform: scale(1.06);
    }

    .player-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
    }

    .player-overlay.active {
      display: block;
    }

    .player-overlay iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: #000000;
      z-index: 10000;
    }

    .back-btn {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 10001;
      background: rgba(20, 20, 20, 0.92);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .back-btn:hover,
    .back-btn:focus,
    .back-btn.tv-focused {
      background: var(--accent);
      border-color: #ffffff;
      color: #ffffff;
      transform: scale(1.05);
    }
  </style>
</head>

    const PAGE_SIZE = 9;
    const NUM_TABS_COUNT = 5;

    const tabTv = document.getElementById("tabTv");
    const tabMovies = document.getElementById("tabMovies");
    const numBtns = Array.from(document.querySelectorAll(".num-btn"));

    const playerOverlay = document.getElementById("playerOverlay");
    const playerFrame = document.getElementById("playerFrame");
    const backBtn = document.getElementById("backBtn");

    let currentTab = "tv";
    let currentPage = 0;
    let focusZone = "grid";
    let focusedTopIndex = 0;
    let focusedSlot = 0;
    let lastPlayedSlot = 0;
    let lastPressTime = 0;
    let isOpening = false;

    function extractYouTubeWatchUrl(rawUrl) {
      if (!rawUrl) return "";
      const trimmed = rawUrl.trim();
      const match = trimmed.match(/src=["']([^"']+)["']/i);
      const extracted = match ? match[1] : trimmed;

      try {
        const parsed = new URL(extracted);
        if (parsed.hostname.includes("youtube.com")) {
          const parts = parsed.pathname.split("/").filter(Boolean);
          const embedIdx = parts.indexOf("embed");
          if (embedIdx !== -1 && parts[embedIdx + 1]) {
            return `https://www.youtube.com/watch?v=${parts[embedIdx + 1]}`;
          }
          const shortsIdx = parts.indexOf("shorts");
          if (shortsIdx !== -1 && parts[shortsIdx + 1]) {
            return `https://www.youtube.com/watch?v=${parts[shortsIdx + 1]}`;
          }
          const vParam = parsed.searchParams.get("v");
          if (vParam) {
            return `https://www.youtube.com/watch?v=${vParam}`;
          }
        }
        if (parsed.hostname === "youtu.be") {
          const vid = parsed.pathname.replace(/^\/+/, "");
          if (vid) {
            return `https://www.youtube.com/watch?v=${vid}`;
          }
        }
      } catch (_) {}
      return "";
    }

    function normalizePlayerUrl(rawUrl) {
      if (!rawUrl) return "";
      const trimmed = rawUrl.trim();
      const match = trimmed.match(/src=["']([^"']+)["']/i);
      const extracted = match ? match[1] : trimmed;

      try {
        const parsed = new URL(extracted);
        if (parsed.hostname === "youtu.be") {
          const videoId = parsed.pathname.replace(/^\/+/, "");
          if (videoId) {
            return `https://www.youtube.com/embed/${videoId}`;
          }
        }
      } catch (_) {}

      return extracted;
    }

    function getItems() {
      return CATALOG[currentTab] || [];
    }

    function getPageSlice(pageIndex) {
      const items = getItems();
      const start = pageIndex * PAGE_SIZE;
      return items.slice(start, start + PAGE_SIZE);
    }

    function getTopElements() {
      return [tabTv, tabMovies, ...numBtns];
    }

    function updateTabsUI() {
      tabTv.classList.toggle("active", currentTab === "tv");
      tabMovies.classList.toggle("active", currentTab === "movies");
      numBtns.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === currentPage);
      });
    }

    function findNearestFilledSlot(cards, desiredSlot) {
      if (cards[desiredSlot] && !cards[desiredSlot].classList.contains("empty-slot")) {
        return desiredSlot;
      }
      for (let i = desiredSlot; i >= 0; i--) {
        if (cards[i] && !cards[i].classList.contains("empty-slot")) {
          return i;
        }
      }
      for (let i = desiredSlot + 1; i < cards.length; i++) {
        if (cards[i] && !cards[i].classList.contains("empty-slot")) {
          return i;
        }
      }
      return -1;
    }

    function updateFocusVisuals() {
      document.querySelectorAll(".tv-focused").forEach(el => el.classList.remove("tv-focused"));

      if (focusZone === "tabs") {
        const topEls = getTopElements();
        focusedTopIndex = Math.max(0, Math.min(focusedTopIndex, topEls.length - 1));
        const btn = topEls[focusedTopIndex];
        if (btn) {
          btn.classList.add("tv-focused");
          btn.focus({ preventScroll: true });
        }
      } else if (focusZone === "grid") {
        const cards = Array.from(grid9.children);
        if (cards.length > 0) {
          const clamped = Math.max(0, Math.min(focusedSlot, cards.length - 1));
          const resolvedIndex = findNearestFilledSlot(cards, clamped);
          if (resolvedIndex !== -1) {
            focusedSlot = resolvedIndex;
            const target = cards[resolvedIndex];
            target.classList.add("tv-focused");
            target.focus({ preventScroll: true });
          }
        }
      } else if (focusZone === "player") {
        backBtn.classList.add("tv-focused");
        backBtn.focus({ preventScroll: true });
      }
    }

    function renderPage(preferredSlot = 0) {
      const maxPageIndex = NUM_TABS_COUNT - 1;
      if (currentPage > maxPageIndex) currentPage = maxPageIndex;
      if (currentPage < 0) currentPage = 0;

      updateTabsUI();

      const slice = getPageSlice(currentPage);
      grid9.innerHTML = "";

      for (let slot = 0; slot < PAGE_SIZE; slot++) {
        const item = slice[slot];
        const card = document.createElement(item ? "button" : "div");
        card.dataset.slot = slot;

        if (item) {
          card.type = "button";
          card.className = "card";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", item.title);

          const img = document.createElement("img");
          img.src = item.cover;
          img.alt = item.title;
          img.loading = "eager";
          img.onerror = function () {
            this.src = "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=800&q=80";
          };

          const info = document.createElement("div");
          info.className = "card-info";

          const title = document.createElement("div");
          title.className = "card-title";
          title.textContent = item.title;

          const badge = document.createElement("span");
          badge.className = "card-badge";
          badge.textContent = currentTab === "tv" ? "TV" : "FILME";

          info.appendChild(title);
          info.appendChild(badge);
          card.appendChild(img);
          card.appendChild(info);

          card.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            const now = Date.now();
            if (isOpening || now - lastPressTime < 400) return;
            lastPressTime = now;
            focusedSlot = slot;
            lastPlayedSlot = slot;
            openPlayer(item.url);
          });
        } else {
          card.className = "card empty-slot";
          card.tabIndex = -1;
          const label = document.createElement("span");
          label.textContent = "Vazio";
          card.appendChild(label);
        }

        grid9.appendChild(card);
      }

      focusedSlot = Math.max(0, Math.min(preferredSlot, PAGE_SIZE - 1));
      if (focusZone === "grid") {
        updateFocusVisuals();
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      focusedTopIndex = tabName === "tv" ? 0 : 1;
      currentPage = 0;
      focusZone = "grid";
      renderPage(0);
    }

    function selectNumberTab(pageIdx) {
      currentPage = Math.max(0, Math.min(pageIdx, NUM_TABS_COUNT - 1));
      focusedTopIndex = 2 + currentPage;
      focusZone = "grid";
      renderPage(0);
    }

    function openPlayer(url) {
      if (isOpening) return;
      isOpening = true;

      const ytWatchUrl = extractYouTubeWatchUrl(url);
      if (ytWatchUrl) {
        window.location.href = ytWatchUrl;
        setTimeout(() => { isOpening = false; }, 1000);
        return;
      }

      const targetUrl = normalizePlayerUrl(url);
      if (!targetUrl) {
        isOpening = false;
        return;
      }

      focusZone = "player";
      playerOverlay.style.display = "block";
      playerOverlay.classList.add("active");
      playerOverlay.setAttribute("aria-hidden", "false");
      playerFrame.src = targetUrl;
      updateFocusVisuals();

      setTimeout(() => {
        isOpening = false;
      }, 400);
    }

    function closePlayer() {
      playerOverlay.classList.remove("active");
      playerOverlay.style.display = "none";
      playerOverlay.setAttribute("aria-hidden", "true");
      playerFrame.src = "about:blank";
      focusZone = "grid";
      renderPage(lastPlayedSlot);
    }

    tabTv.addEventListener("click", () => switchTab("tv"));
    tabMovies.addEventListener("click", () => switchTab("movies"));
    numBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => selectNumberTab(idx));
    });

    backBtn.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      closePlayer();
    });

    window.addEventListener("keydown", (e) => {
      const code = e.keyCode;
      const key = e.key;

      if (focusZone === "player") {
        if (key === "Escape" || key === "Backspace" || code === 461 || code === 10009 || code === 8) {
          e.preventDefault();
          e.stopPropagation();
          closePlayer();
        } else if (key === "Enter" || code === 13) {
          e.preventDefault();
          e.stopPropagation();
          closePlayer();
        }
        return;
      }

      const isUp = key === "ArrowUp" || code === 38;
      const isDown = key === "ArrowDown" || code === 40;
      const isLeft = key === "ArrowLeft" || code === 37;
      const isRight = key === "ArrowRight" || code === 39;
      const isEnter = key === "Enter" || code === 13;
      const isBack = key === "Escape" || key === "Backspace" || code === 461 || code === 10009;

      if (!isUp && !isDown && !isLeft && !isRight && !isEnter && !isBack) {
        return;
      }

      e.preventDefault();

      if (isBack && currentPage > 0) {
        currentPage -= 1;
        renderPage(focusedSlot);
        return;
      }

      if (focusZone === "tabs") {
        const topEls = getTopElements();
        if (isLeft) {
          focusedTopIndex = Math.max(0, focusedTopIndex - 1);
          updateFocusVisuals();
        } else if (isRight) {
          focusedTopIndex = Math.min(topEls.length - 1, focusedTopIndex + 1);
          updateFocusVisuals();
        } else if (isDown) {
          focusZone = "grid";
          renderPage(0);
        } else if (isEnter) {
          if (focusedTopIndex === 0) {
            switchTab("tv");
          } else if (focusedTopIndex === 1) {
            switchTab("movies");
          } else {
            selectNumberTab(focusedTopIndex - 2);
          }
        }
        return;
      }

      const col = focusedSlot % 3;
      const row = Math.floor(focusedSlot / 3);
      const maxPageIndex = NUM_TABS_COUNT - 1;

      if (isLeft) {
        if (col > 0) {
          focusedSlot -= 1;
          updateFocusVisuals();
        } else if (currentPage > 0) {
          currentPage -= 1;
          renderPage(row * 3 + 2);
        }
      } else if (isRight) {
        if (col < 2) {
          focusedSlot += 1;
          updateFocusVisuals();
        } else if (currentPage < maxPageIndex) {
          currentPage += 1;
          renderPage(row * 3);
        }
      } else if (isUp) {
        if (row > 0) {
          focusedSlot -= 3;
          updateFocusVisuals();
        } else if (currentPage > 0) {
          currentPage -= 1;
          renderPage(6 + col);
        } else {
          focusZone = "tabs";
          focusedTopIndex = 2 + currentPage;
          updateFocusVisuals();
        }
      } else if (isDown) {
        if (row < 2) {
          focusedSlot += 3;
          updateFocusVisuals();
        } else {
          if (currentPage < maxPageIndex) {
            currentPage += 1;
            renderPage(col);
          } else {
            currentPage = 0;
            renderPage(col);
          }
        }
      } else if (isEnter) {
        const now = Date.now();
        if (isOpening || now - lastPressTime < 400) return;
        lastPressTime = now;
        const slice = getPageSlice(currentPage);
        const item = slice[focusedSlot];
        if (item && item.url) {
          lastPlayedSlot = focusedSlot;
          openPlayer(item.url);
        }
      }
    });

    let wheelLock = false;
    window.addEventListener("wheel", (e) => {
      if (focusZone === "player" || wheelLock) return;
      if (Math.abs(e.deltaY) < 20) return;

      wheelLock = true;
      const maxPageIndex = NUM_TABS_COUNT - 1;

      if (e.deltaY > 0) {
        currentPage = currentPage < maxPageIndex ? currentPage + 1 : 0;
      } else {
        currentPage = currentPage > 0 ? currentPage - 1 : maxPageIndex;
      }

      focusZone = "grid";
      renderPage(focusedSlot);

      setTimeout(() => {
        wheelLock = false;
      }, 220);
    }, { passive: true });

    renderPage(0);
  </script>
</body>
</html>
